version: '3.8'

services:
  # خدمة سيرفر LiveKit للمكالمات الصوتية
  livekit:
    image: livekit/livekit-server:latest
    container_name: awsan_livekit
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: always

  # خدمة n8n لإدارة سير العمل والربط
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: awsan_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - ~/.n8n:/home/node/.n8n
    restart: always
